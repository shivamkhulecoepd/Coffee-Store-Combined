services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: beanbrew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beanbrew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass123}
      POSTGRES_DB: ${POSTGRES_DB:-beanbrew}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beanbrew} -d ${POSTGRES_DB:-beanbrew}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: beanbrew-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-pass123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pass123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for Database Management (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: beanbrew-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@beanbrew.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Backend API Service
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: beanbrew-api
  #   restart: unless-stopped
  #   environment:
  #     NODE_ENV: ${NODE_ENV:-production}
  #     PORT: ${PORT:-3000}
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-beanbrew}:${POSTGRES_PASSWORD:-pass123}@postgres:5432/${POSTGRES_DB:-beanbrew}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-pass123}
  #     REDIS_URL: redis://:${REDIS_PASSWORD:-pass123}@redis:6379
  #     JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
  #     JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
  #     CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
  #     FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  #   ports:
  #     - "${PORT:-3000}:3000"
  #   volumes:
  #     - ./uploads:/app/uploads
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  # Development: Hot-reload Backend
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: beanbrew-api-dev
    restart: no
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-beanbrew}:${POSTGRES_PASSWORD:-pass123}@postgres:5432/${POSTGRES_DB:-beanbrew}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pass123}
      REDIS_URL: redis://:${REDIS_PASSWORD:-pass123}@redis:6379
      JWT_SECRET: dev-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: dev-refresh-secret-not-for-production
      CORS_ORIGIN: "*"
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  default:
    name: beanbrew-network
